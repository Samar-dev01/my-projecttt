<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xarid savatchasi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h2 class="mb-3">Mahsulotlar</h2>
        <table class="table table-striped">
            <thead>
                <th>id</th>
                <th>name</th>
                <th>price</th>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
        <div class="row mt-5">
            <div class="col-6">
                <label for="mahsulot-id" class="form-label">Mahsulotning id'isini kiriting</label>
                <input type="number" id="mahsulot-id" class="form-control">
            </div>
            <div class="col-6">
                <label for="mahsulot-soni" class="form-label">Mahsulot sonini kiriting</label>
                <input type="number" id="mahsulot-soni" class="form-control">
            </div>
            <div class="col-12 mt-5 d-flex justify-content-center">
                <button class="btn btn-primary" id="btn">Mahsulotni savatchaga qo'shish</button>
            </div>
        </div>
        <h2 class="mt-5 mb-3">Savatchaga qo'shilgan mahsulotlar</h2>
        <table class="table table-striped">
            <thead>
                <th>id</th>
                <th>name</th>
                <th>price</th>
                <th>quantity</th>
            </thead>
            <tbody id="t-body_s">
                
            </tbody>
        </table>
        <h2 class="mt-5 mb-3">Mahsulotni savatchadan o'chirish</h2>
        <div class="row">
            <div class="col-4">
                <label for="mahsulot-och-id" class="form-label">O'chirmoqchi bo'lgan mahsulot id raqami</label>
                <input type="number" id="mahsulot-och-id" class="form-control">
            </div>
            
            <div class="col-4 d-flex align-items-end">
                <button class="btn btn-warning" id="btn2">Mahsulotni savatchadan o'chirish</button>
            </div>
            <div class="col-4 d-flex align-items-end">
                <button class="btn btn-danger" id="btn3">Savatchani tozalash</button>
            </div>
        </div>
    </div>


    <script src="scripts/card.js"></script>
</body>

</html>
